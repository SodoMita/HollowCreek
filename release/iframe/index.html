<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Hollow Creek</title>
<meta name="description" content="A 1D multiplayer horror deduction game. Walk one autumn street and cage the thing wearing your neighbour's face." />
<meta name="theme-color" content="#0b0710" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0710; overflow: hidden; }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
  #fallback {
    position: fixed; inset: 0; display: none; place-items: center;
    color: #9c8b7a; font: 15px/1.6 ui-sans-serif, system-ui, sans-serif; text-align: center; padding: 24px;
  }
  #fallback a { color: #d99a3d; }
</style>
</head>
<body>
<iframe id="game" title="Hollow Creek"
        src="https://sodomita.github.io/HollowCreek/"
        allow="autoplay; fullscreen; gamepad; clipboard-write"
        allowfullscreen></iframe>
<div id="fallback">
  <div>
    <p>Hollow Creek could not be loaded in this frame.</p>
    <p><a href="https://sodomita.github.io/HollowCreek/">Open the game in its own tab</a></p>
  </div>
</div>
<script>
  // This file exists so the Newgrounds upload never has to change: it simply
  // frames the GitHub Pages build, and the Pages build is what talks to the
  // game server. Move the server, republish Pages, and this zip still works.
  (function () {
    var target = "https://sodomita.github.io/HollowCreek/";
    var frame = document.getElementById("game");
    // Forward ?server=... (and anything else) so a project URL can pin a
    // particular game server without anyone typing an address into the menu.
    if (location.search && location.search !== "?") {
      frame.src = target + location.search;
    }
    // If the frame cannot load at all (offline, blocked), offer a way out.
    var shown = false;
    frame.addEventListener("error", function () {
      shown = true;
      document.getElementById("fallback").style.display = "grid";
    });
    frame.addEventListener("load", function () {
      if (!shown) document.getElementById("fallback").style.display = "none";
    });
    setTimeout(function () {
      try {
        if (!frame.contentWindow || frame.contentWindow.length === 0 && !shown) {
          /* cross-origin frames throw on access; only the error path matters */
        }
      } catch (e) { /* cross-origin, which means it loaded */ }
    }, 4000);
  })();
</script>
</body>
</html>
