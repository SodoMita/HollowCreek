<svg xmlns="http://www.w3.org/2000/svg" width="40" height="54" viewBox="0 0 40 54"><title>Hooded traveler</title>
<style>:root{--cloak:#3a7ca5;--eyes:#eee6ce;--leg-a:translate(0px,0px);--leg-b:translate(0px,0px);--legs-opacity:1;/* RUNTIME PALETTE */}</style>
<g id="legs" opacity="var(--legs-opacity)" fill="none" stroke="#141015" stroke-width="5" stroke-linecap="round"><path id="left-leg" style="transform:var(--leg-a)" d="M16 39v12l3 1"/><path id="right-leg" style="transform:var(--leg-b)" d="M24 39v12l3 1"/></g>
<g id="cloak"><path d="M8 42Q5 23 12 13Q20 5 29 13Q35 24 32 42Q20 46 8 42Z" fill="var(--cloak)" stroke="#e9c7a4" stroke-opacity=".16"/><path d="M8 42Q5 23 12 13Q15 24 15 42Z" fill="#08060a" opacity=".3"/><path d="M26 24q3 8 2 16" fill="none" stroke="#fff0d8" stroke-opacity=".22"/><path d="M11 21L5 34M29 21l6 13" fill="none" stroke="var(--cloak)" stroke-width="5" stroke-linecap="round"/><circle cx="23" cy="27" r="1.5" fill="#d9b977"/></g>
