<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="371" height="93" viewBox="-140 -85 371 93">
  <title>Room layout: orchard</title>
  <!-- Furniture placement for one house. Each image element is one object. href is its SVG file, relative to this folder.
       x is world units from the house centre; y is from the ground line (negative is up). width and height are its size.
       Optional data-when="done" or data-when="unfinished" shows the object only in that task state.
       Move or resize objects in an SVG editor, then reload the game. -->
  <line id="ground" x1="-140" y1="0" x2="231" y2="0" stroke="#8a7a66" stroke-width="1" stroke-dasharray="4 3"/>
  <image id="rug" href="../furniture/rug.svg" x="-70" y="-11" width="140" height="11"/>
  <image id="shelf" href="../furniture/shelf.svg" x="-132" y="-77" width="56" height="19"/>
  <image id="pantry" href="../furniture/pantry.svg" x="-60" y="-70" width="80" height="70"/>
  <image id="crate" href="../furniture/crate.svg" x="65" y="-25" width="38" height="25"/>
  <image id="table" href="../furniture/table.svg" x="-130" y="-42" width="52" height="42"/>
  <image id="entrance-barrel" href="../furniture/barrel.svg" x="191" y="-36" width="32" height="36"/>
</svg>
