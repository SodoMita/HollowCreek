<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="374" height="96" viewBox="-236 -88 374 96">
  <title>Room layout: quarry</title>
  <!-- Furniture placement for one house. Each image element is one object. href is its SVG file, relative to this folder.
       x is world units from the house centre; y is from the ground line (negative is up). width and height are its size.
       Optional data-when="done" or data-when="unfinished" shows the object only in that task state.
       Move or resize objects in an SVG editor, then reload the game. -->
  <line id="ground" x1="-236" y1="0" x2="138" y2="0" stroke="#8a7a66" stroke-width="1" stroke-dasharray="4 3"/>
  <image id="rug" href="../furniture/rug.svg" x="-70" y="-11" width="140" height="11"/>
  <image id="bed" href="../furniture/bed.svg" x="-120" y="-38" width="82" height="38"/>
  <image id="fusebox" href="../furniture/fusebox.svg" x="-2" y="-80" width="54" height="50"/>
  <image id="live-fuses" data-when="done" href="../furniture/fuses-live.svg" x="-2" y="-80" width="54" height="50"/>
  <image id="shelf" href="../furniture/shelf.svg" x="74" y="-75" width="56" height="19"/>
  <image id="crate" href="../furniture/crate.svg" x="83" y="-25" width="38" height="25"/>
  <image id="entrance-barrel" href="../furniture/barrel.svg" x="-228" y="-36" width="32" height="36"/>
</svg>
