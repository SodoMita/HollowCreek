<svg xmlns="http://www.w3.org/2000/svg" width="300" height="158" viewBox="0 0 300 158" data-ref="tretyakov">
<!-- Hand-authored reference asset: Dom-dvor M. A. Tretyakova, 2nd half 19th c., d. Gari (Malye Korely) — kept "po-chyornomu" heating. Not generated by any script. -->
<title>Tretyakov house — exterior: compact dom-dvor with single ridge, wooden dymnik instead of a chimney (po-chyornomu), small windows, vzvoz ramp</title>
<rect width="300" height="158" fill="#16121c"/>
<!-- single gable ridge over the whole dom-dvor -->
<path d="M20 70 L150 16 L280 70 Z" fill="#4a3a2c" stroke="#241a14" stroke-width="2"/>
<path d="M20 70 h260" stroke="#2c2018" stroke-width="4"/>
<!-- wooden dymnik (smoke vent) on the roof — the sign of po-chyornomu heating -->
<g><path d="M186 34 h20 l-4 -18 h-12 Z" fill="#5d4a34" stroke="#241a14" stroke-width="1.6"/><path d="M190 16 h12 l-2 -6 h-8 Z" fill="#3a2b1c" stroke="#241a14"/></g>
<!-- one log volume, modest -->
<rect x="28" y="70" width="244" height="78" fill="#63492f" stroke="#241a14"/>
<g stroke="#33241a" stroke-width="1.5"><path d="M28 80 h244 M28 90 h244 M28 100 h244 M28 110 h244 M28 120 h244 M28 130 h244 M28 140 h244"/></g>
<path d="M34 70 v78 M266 70 v78" stroke="#4a3823" stroke-width="6"/>
<!-- four small windows with simple platbands -->
<g fill="#e8c88a" stroke="#241a14" stroke-width="2"><rect x="46" y="82" width="24" height="22"/><rect x="96" y="82" width="24" height="22"/><rect x="180" y="82" width="24" height="22"/><rect x="230" y="82" width="24" height="22"/></g>
<g stroke="#241a14" stroke-width="1.2"><path d="M58 82 v22 M46 93 h24 M108 82 v22 M96 93 h24 M192 82 v22 M180 93 h24 M242 82 v22 M230 93 h24"/></g>
<g fill="#b08a5c" stroke="#241a14"><rect x="44" y="77" width="28" height="4"/><rect x="94" y="77" width="28" height="4"/><rect x="178" y="77" width="28" height="4"/><rect x="228" y="77" width="28" height="4"/></g>
<!-- main door + vzvoz ramp at the khozyain end -->
<rect x="140" y="112" width="22" height="36" fill="#4a3823" stroke="#241a14" stroke-width="2"/>
<path d="M244 148 L282 100 L282 148 Z" fill="#54402e" stroke="#241a14" stroke-width="2"/>
<path d="M248 140 L278 106" stroke="#241a14" stroke-width="1.4"/>
<g fill="#5f584e" stroke="#241a14"><ellipse cx="60" cy="151" rx="13" ry="6"/><ellipse cx="150" cy="152" rx="14" ry="6"/><ellipse cx="240" cy="151" rx="12" ry="6"/></g>
</svg>
