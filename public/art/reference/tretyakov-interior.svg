<svg xmlns="http://www.w3.org/2000/svg" width="300" height="112" viewBox="0 0 300 112" data-ref="tretyakov">
<!-- Hand-authored reference asset: interior of the Tretyakov house — soot-blackened logs from po-chyornomu heating, hanging cradle. Malye Korely. Not generated by any script. -->
<title>Tretyakov house — interior: blackened ceiling and upper logs (po-chyornomu), hanging zybka cradle, bench, icon shelf</title>
<rect width="300" height="112" fill="#120d09"/>
