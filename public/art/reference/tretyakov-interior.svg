<rect width="300" height="20" fill="#171009"/>
<g stroke="#0c0805" stroke-width="1.4"><path d="M0 5 h300 M0 10 h300 M0 15 h300 M45 0 v20 M120 0 v20 M195 0 v20 M270 0 v20"/></g>
<!-- logs darkened by smoke near the ceiling, lighter below -->
<rect y="20" width="300" height="30" fill="#3c2c1e"/>
<rect y="50" width="300" height="48" fill="#5a432e"/>
<g stroke="#241a10" stroke-width="1.6"><path d="M0 28 h300 M0 36 h300 M0 44 h300 M0 58 h300 M0 66 h300 M0 74 h300 M0 82 h300 M0 90 h300"/></g>
