<g fill="#e0cf9e" stroke="#241a14" stroke-width="2"><rect x="216" y="30" width="34" height="28"/></g>
<path d="M233 30 v28 M216 44 h34" stroke="#241a14" stroke-width="1.3"/>
<!-- hanging cradle (zybka) on a red checkered blanket from the ceiling beam -->
