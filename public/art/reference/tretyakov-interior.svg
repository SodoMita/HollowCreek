<rect x="76" y="66" width="30" height="6" fill="#b8b0a0" stroke="#241a14"/>
<!-- icon shelf (bozhnitsa) corner -->
<rect x="180" y="52" width="26" height="20" fill="#3a2b1c" stroke="#241a14"/>
<rect x="184" y="55" width="8" height="12" fill="#c9a44c" stroke="#241a14" stroke-width="1"/>
<rect x="194" y="57" width="8" height="10" fill="#8a3a2e" stroke="#241a14" stroke-width="1"/>
