<path d="M96 22 v14" stroke="#241a14" stroke-width="2"/>
<path d="M78 36 h36 l-6 26 h-24 Z" fill="#a03a2e" stroke="#241a14" stroke-width="1.6"/>
<path d="M82 42 h28 M84 50 h24 M86 58 h20" stroke="#d8cfc0" stroke-width="1.4"/>
