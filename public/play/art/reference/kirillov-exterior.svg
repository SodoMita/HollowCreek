<svg xmlns="http://www.w3.org/2000/svg" width="300" height="158" viewBox="0 0 300 158" data-ref="kirillov">
<!-- Hand-authored reference asset: Dom-dvor E. I. Kirillova, end 19th c., d. Kiselevo (Malye Korely) — "dom o dvukh konyakh". Not generated by any script. -->
<title>Kirillov house — exterior: two parallel ridges ("house of two horses"), 7 paneled-shutter windows, vzvoz ramp to the поветь</title>
<rect width="300" height="158" fill="#1a1420"/>
<!-- two parallel gable ridges: zhiloy part + khozyain part -->
<path d="M14 66 L92 18 L170 66 Z" fill="#54402e" stroke="#241a14" stroke-width="2"/>
<path d="M130 66 L208 18 L286 66 Z" fill="#4a3a2c" stroke="#241a14" stroke-width="2"/>
<path d="M14 66 h156 M130 66 h156" stroke="#2c2018" stroke-width="4"/>
<!-- two ridge "horses" (konyki) -->
<path d="M92 18 q-8 -10 -2 -14 q10 2 6 12 Z" fill="#c99a7c" stroke="#241a14"/>
<path d="M208 18 q-8 -10 -2 -14 q10 2 6 12 Z" fill="#c99a7c" stroke="#241a14"/>
<!-- log walls of both volumes -->
<rect x="22" y="66" width="140" height="82" fill="#6e5138" stroke="#241a14"/>
<rect x="138" y="66" width="140" height="82" fill="#63492f" stroke="#241a14"/>
<g stroke="#3a2b1c" stroke-width="1.4"><path d="M22 76 h140 M22 86 h140 M22 96 h140 M22 106 h140 M22 116 h140 M22 126 h140 M22 136 h140 M138 76 h140 M138 86 h140 M138 96 h140 M138 106 h140 M138 116 h140 M138 126 h140 M138 136 h140"/></g>
<!-- seven windows with paneled (filyonchatye) shutters -->
<g>
  <g fill="#f0c276" stroke="#241a14" stroke-width="2">
    <rect x="32" y="76" width="22" height="24"/><rect x="62" y="76" width="22" height="24"/><rect x="92" y="76" width="22" height="24"/><rect x="122" y="76" width="22" height="24"/>
    <rect x="148" y="76" width="22" height="24"/><rect x="178" y="76" width="22" height="24"/><rect x="208" y="76" width="22" height="24"/><rect x="238" y="76" width="22" height="24"/>
  </g>
  <g stroke="#241a14" stroke-width="1.2"><path d="M43 76 v24 M32 88 h22 M73 76 v24 M62 88 h22 M103 76 v24 M92 88 h22 M133 76 v24 M122 88 h22 M159 76 v24 M148 88 h22 M189 76 v24 M178 88 h22 M219 76 v24 M208 88 h22 M249 76 v24 M238 88 h22"/></g>
  <g fill="#7a5a3c" stroke="#241a14" stroke-width="1"><rect x="30" y="70" width="26" height="5"/><rect x="60" y="70" width="26" height="5"/><rect x="90" y="70" width="26" height="5"/><rect x="120" y="70" width="26" height="5"/><rect x="146" y="70" width="26" height="5"/><rect x="176" y="70" width="26" height="5"/><rect x="206" y="70" width="26" height="5"/><rect x="236" y="70" width="26" height="5"/></g>
</g>
<!-- door of the zhiloy part and vzvoz ramp up to the поветь of the khozyain part -->
<rect x="52" y="116" width="20" height="32" fill="#4a3823" stroke="#241a14" stroke-width="2"/>
<path d="M250 148 L286 96 L286 148 Z" fill="#5d4a34" stroke="#241a14" stroke-width="2"/>
<path d="M254 140 L282 104 M258 132 L284 100" stroke="#241a14" stroke-width="1.4"/>
