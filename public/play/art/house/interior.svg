<svg xmlns="http://www.w3.org/2000/svg" width="300" height="112" viewBox="0 0 300 112">
<title>Pomor log interior wall and floorboards</title>
<defs><linearGradient id="wall" x2="1" y2="1"><stop stop-color="#6e4f3c"/><stop offset="1" stop-color="#33241f"/></linearGradient>
<pattern id="logs" width="300" height="9" patternUnits="userSpaceOnUse"><rect width="300" height="9" fill="url(#wall)"/><path d="M0 8.2H300" stroke="#1a1210" stroke-opacity=".6" stroke-width="1.3"/><path d="M0 1H300" stroke="#eec39c" stroke-opacity=".09"/><path d="M60 0v9M170 0v9M255 0v9" stroke="#1a1210" stroke-opacity=".3"/></pattern>
<linearGradient id="floor" x2="0" y2="1"><stop stop-color="#4a382c"/><stop offset="1" stop-color="#2c201a"/></linearGradient>
<radialGradient id="window-glow"><stop stop-color="#f4c58c" stop-opacity=".30"/><stop offset="1" stop-color="#f4c58c" stop-opacity="0"/></radialGradient></defs>
<radialGradient id="lampglow"><stop stop-color="#ffca7a" stop-opacity=".34"/><stop offset="1" stop-color="#ffca7a" stop-opacity="0"/></radialGradient>
<g id="ceiling"><rect width="300" height="9" fill="#2c1f18"/><path d="M0 8h300" stroke="#4a382c" stroke-width="2"/><path d="M0 3h300" stroke="#171010" stroke-opacity=".6"/></g>
<ellipse cx="228" cy="20" rx="46" ry="26" fill="url(#lampglow)"/><path d="M228 9v8" stroke="#241a14" stroke-width="2"/><rect x="222" y="17" width="12" height="12" rx="2" fill="#ffca7a" fill-opacity=".85" stroke="#241a14"/>
<g id="back-wall"><rect width="300" height="102" fill="url(#logs)"/><path d="M6 2V100M294 2V100" stroke="#241a18" stroke-width="5" opacity=".7"/><ellipse cx="74" cy="50" rx="44" ry="40" fill="url(#window-glow)"/><ellipse cx="210" cy="50" rx="44" ry="40" fill="url(#window-glow)"/><path d="M0 101h300" stroke="#1a1210" stroke-width="2"/></g>
<g id="floor"><rect y="102" width="300" height="10" fill="url(#floor)"/><path d="M0 106.5h300" stroke="#e6b78a" stroke-opacity=".10"/><path d="M40 102v10M95 102v10M150 102v10M205 102v10M260 102v10" stroke="#1a1210" stroke-opacity=".45"/></g>
