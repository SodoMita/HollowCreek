<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="286" height="103" viewBox="-148 -95 286 103">
  <title>Room layout: lodge</title>
  <!-- Furniture placement for one house. Each image element is one object. href is its SVG file, relative to this folder.
       x is world units from the house centre; y is from the ground line (negative is up). width and height are its size.
       Optional data-when="done" or data-when="unfinished" shows the object only in that task state.
       Move or resize objects in an SVG editor, then reload the game. -->
  <line id="ground" x1="-148" y1="0" x2="138" y2="0" stroke="#8a7a66" stroke-width="1" stroke-dasharray="4 3"/>
  <image id="rug" href="../furniture/rug.svg" x="-70" y="-11" width="140" height="11"/>
  <image id="desk" href="../furniture/desk.svg" x="60" y="-42" width="70" height="42"/>
  <image id="clock" href="../furniture/clock.svg" x="-16" y="-84" width="32" height="84"/>
  <image id="frame" href="../furniture/frame.svg" x="-104" y="-87" width="28" height="25"/>
  <image id="shelf" href="../furniture/shelf.svg" x="-92" y="-61" width="56" height="19"/>
  <image id="entrance-barrel" href="../furniture/barrel.svg" x="-140" y="-36" width="32" height="36"/>
</svg>
