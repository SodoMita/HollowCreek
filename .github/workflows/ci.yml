name: ci
on:
  push:
    branches: [main, develop-archive]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # DB-free suites run anywhere; DB suites only when the secret exists.
      - run: |
          for t in test-rng test-fingerprint test-wards test-house-wards test-ward-ui test-voice test-voice-client; do
            node scripts/$t.mjs || exit 1
          done
      - if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for t in test-notes test-time-engine test-time-multi test-time-nested test-time-seeing test-command-replay test-replay-determinism; do
            node scripts/$t.mjs || exit 1
          done
      - if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run build
